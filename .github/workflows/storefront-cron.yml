name: Storefront Operations Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

# A previous invocation must finish before the next scheduled run starts; these
# jobs reconcile durable state and must not be cancelled halfway through.
concurrency:
  group: storefront-operations-cron
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BACKEND_WORKER_URL: ${{ vars.BACKEND_WORKER_URL }}
      CRON_SECRET: ${{ secrets.STOREFRONT_CRON_SECRET }}
    steps:
      - name: Invoke protected Worker jobs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_WORKER_URL"
          test -n "$CRON_SECRET"
          if [[ ! "$BACKEND_WORKER_URL" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev/?$ ]]; then
            echo "BACKEND_WORKER_URL must be an HTTPS Cloudflare workers.dev origin" >&2
            exit 1
          fi
          BACKEND_WORKER_URL="${BACKEND_WORKER_URL%/}"
          for path in \
            /internal/cron/finalize-payment-attempts \
            /internal/cron/campaigns \
            /internal/cron/payment-reconciliation \
            /internal/cron/media-storage-cleanup \
            /internal/cron/inventory-reservations \
            /internal/cron/back-in-stock; do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_WORKER_URL$path"
            printf '\n'
          done
