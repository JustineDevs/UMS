name: SBOM & License Review

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'

concurrency:
  group: sbom-license-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json --output-format JSON
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high
      - name: Check for high or critical vulnerabilities
        run: |
          set -euo pipefail
          # pnpm returns non-zero when any advisory exists, including moderate
          # and low findings. Capture the report so the gate can enforce only
          # the release-blocking severities below.
          set +e
          pnpm audit --prod --json > audit.json
          AUDIT_EXIT=$?
          set -e
          CRITICAL=$(node -e "const a=require('./audit.json'); process.stdout.write(String(a.metadata?.vulnerabilities?.critical ?? 0))")
          HIGH=$(node -e "const a=require('./audit.json'); process.stdout.write(String(a.metadata?.vulnerabilities?.high ?? 0))")
          echo "Critical: $CRITICAL, High: $HIGH (audit exit: $AUDIT_EXIT)"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::High or critical vulnerabilities found"
            exit 1
          fi

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check licenses
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0;AGPL-1.0;GPL-2.0" --summary
