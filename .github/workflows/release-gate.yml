name: release-gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Medusa validates DATABASE_URL while loading its build config; the build
      # does not connect to this address. Runtime and E2E jobs must use a real DB.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/medusa_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Release gate
        run: pnpm release-gate
