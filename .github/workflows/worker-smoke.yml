name: worker-smoke

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: HTTPS Cloudflare Worker URL to verify
        required: true
        default: https://ums-backend-production.pcg0255.workers.dev
        type: string

permissions: read-all

concurrency:
  group: worker-smoke-${{ github.event.inputs.worker_url || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Verify Worker deployment
        env:
          UVS_WORKER_SMOKE_URLS: ${{ inputs.worker_url }}
        run: node scripts/cloudflare-worker-smoke.mjs --json
