name: E2E Release Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commerce-browser-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d medusa_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      HAS_PSP_SECRETS: ${{ secrets.E2E_STRIPE_API_KEY != '' || secrets.E2E_PAYPAL_CLIENT_ID != '' || secrets.E2E_XENDIT_SECRET_KEY != '' }}
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/medusa_ci
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:3001,http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:3001,http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build workspace SDK dependencies
        run: pnpm --filter @universal-music-store/sdk... build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare Medusa E2E data
        run: |
          pnpm --filter medusa exec medusa db:migrate --all-or-nothing
          pnpm e2e:prep:medusa
          MEDUSA_PUBLISHABLE_API_KEY="$(psql "$DATABASE_URL" -Atqc "SELECT token FROM api_key WHERE type = 'publishable' AND revoked_at IS NULL ORDER BY created_at LIMIT 1")"
          test -n "$MEDUSA_PUBLISHABLE_API_KEY"
          echo "MEDUSA_PUBLISHABLE_API_KEY=$MEDUSA_PUBLISHABLE_API_KEY" >> "$GITHUB_ENV"
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_URL: http://localhost:9000
      - name: Run explicit critical browser suites
        run: pnpm test:e2e:critical -- --project=chromium
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_URL: http://localhost:9000
          E2E_BASE_URL: http://localhost:3000
          CI_STRICT_E2E: "1"
      - name: Run PSP full matrix (when secrets present)
        if: env.HAS_PSP_SECRETS == 'true'
        run: pnpm test:e2e:psp-full -- --project=chromium
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_URL: http://localhost:9000
          E2E_BASE_URL: http://localhost:3000
          CI_STRICT_E2E: "1"
          E2E_STRIPE_API_KEY: ${{ secrets.E2E_STRIPE_API_KEY }}
          E2E_STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
          E2E_PAYPAL_CLIENT_ID: ${{ secrets.E2E_PAYPAL_CLIENT_ID }}
          E2E_PAYPAL_CLIENT_SECRET: ${{ secrets.E2E_PAYPAL_CLIENT_SECRET }}
          E2E_XENDIT_SECRET_KEY: ${{ secrets.E2E_XENDIT_SECRET_KEY }}
          E2E_XENDIT_WEBHOOK_TOKEN: ${{ secrets.E2E_XENDIT_WEBHOOK_TOKEN }}
        continue-on-error: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d medusa_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/medusa_ci
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:3001,http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:3001,http://localhost:9000
      MEDUSA_BACKEND_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build workspace SDK dependencies
        run: pnpm --filter @universal-music-store/sdk... build
      - name: Prepare and start Medusa
        run: |
          pnpm --filter medusa exec medusa db:migrate --all-or-nothing
          pnpm e2e:prep:medusa
          MEDUSA_PUBLISHABLE_API_KEY="$(psql "$DATABASE_URL" -Atqc "SELECT token FROM api_key WHERE type = 'publishable' AND revoked_at IS NULL ORDER BY created_at LIMIT 1")"
          test -n "$MEDUSA_PUBLISHABLE_API_KEY"
          echo "MEDUSA_PUBLISHABLE_API_KEY=$MEDUSA_PUBLISHABLE_API_KEY" >> "$GITHUB_ENV"
          pnpm --filter medusa dev > "$RUNNER_TEMP/medusa.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/medusa.log"
          exit 1
      - name: Run contract tests
        run: node --import tsx/esm --test apps/storefront/src/lib/__tests__/medusa-contract.test.ts
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          STRICT_CONTRACT_TESTS: "1"
