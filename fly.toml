# Fly.io deployment for the Medusa commerce backend.
#
# The Next.js storefront remains independently deployable on Vercel. This app
# owns the commerce API and must use an external Postgres-compatible database
# (Supabase/managed Postgres); no Fly volume is required for application state.

app = "universal-music-store-medusa"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.medusa"

[env]
  NODE_ENV = "production"
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2

[deploy]
  strategy = "rolling"
