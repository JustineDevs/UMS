services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "1"
    expose:
      - "4000"
    restart: unless-stopped
    networks:
      - uvs-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
      target: runtime
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.uvs.jstn.site}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOME: /tmp/medusa-config
      XDG_CONFIG_HOME: /tmp/medusa-config
      APPDATA: /tmp/medusa-config
      LOCALAPPDATA: /tmp/medusa-config
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.uvs.jstn.site}
      PUBLIC_STOREFRONT_URL: ${PUBLIC_STOREFRONT_URL:-https://store.uvs.jstn.site}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://store.uvs.jstn.site}
      STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:-https://store.uvs.jstn.site}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.uvs.jstn.site}
      AUTH_CORS: ${AUTH_CORS:-https://admin.uvs.jstn.site}
      STORE_CORS: ${STORE_CORS:-https://store.uvs.jstn.site}
      STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:-https://store.uvs.jstn.site}
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - uvs-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      medusa:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/backend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - uvs-backend

networks:
  uvs-backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
