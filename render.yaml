services:
  - type: web
    name: universal-music-store-medusa
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.medusa
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MEDUSA_INTERNAL_ADMIN_TOKEN
        sync: false
      - key: STORE_CORS
        value: https://universalmusic.vercel.app
      - key: ADMIN_CORS
        value: https://universalmusic-admin.vercel.app
      - key: AUTH_CORS
        value: https://universalmusic-admin.vercel.app
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: live
      - key: MEDUSA_ALLOW_UNVERIFIED_PAYPAL_WEBHOOKS
        value: "false"
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_WEBHOOK_TOKEN
        sync: false
      - key: TRACKING_HMAC_SECRET
        sync: false
      # Pancake POS is the logistics boundary; direct J&T credentials are not used.
      - key: PANCAKE_POS_API_URL
        value: https://pos.pages.fm/api/v1
      - key: PANCAKE_POS_API_KEY
        sync: false
      - key: PANCAKE_POS_SHOP_ID
        sync: false
      - key: PANCAKE_POS_PICKUP_NAME
        value: Universal Music Store
      - key: PANCAKE_POS_PICKUP_PHONE
        sync: false
      - key: PANCAKE_POS_PICKUP_PROVINCE
        value: Cavite
      - key: PANCAKE_POS_PICKUP_CITY
        value: General Trias
      - key: PANCAKE_POS_PICKUP_AREA
        value: Navarro
      - key: PANCAKE_POS_PICKUP_ADDRESS
        sync: false
