services:
  medusa:
    build:
      context: .
      dockerfile: Dockerfile.medusa
      target: ${MEDUSA_DOCKER_TARGET:-dev}
    env_file:
      - .env.local
    entrypoint: []
    environment:
      CI: "true"
      HOME: /tmp/medusa-config
      NODE_ENV: ${MEDUSA_DOCKER_ENV:-development}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:?STRIPE_CHECKOUT_SUCCESS_URL must be configured}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:?STRIPE_CHECKOUT_CANCEL_URL must be configured}
      PUBLIC_STOREFRONT_URL: ${PUBLIC_STOREFRONT_URL:?PUBLIC_STOREFRONT_URL must be configured}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:?NEXT_PUBLIC_STOREFRONT_URL must be configured}
      STOREFRONT_PUBLIC_URL: ${STOREFRONT_PUBLIC_URL:?STOREFRONT_PUBLIC_URL must be configured}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:?PAYPAL_RETURN_URL must be configured}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:?PAYPAL_CANCEL_URL must be configured}
      XENDIT_CHECKOUT_SUCCESS_URL: ${XENDIT_CHECKOUT_SUCCESS_URL:?XENDIT_CHECKOUT_SUCCESS_URL must be an HTTPS public callback}
      XENDIT_CHECKOUT_CANCEL_URL: ${XENDIT_CHECKOUT_CANCEL_URL:?XENDIT_CHECKOUT_CANCEL_URL must be an HTTPS public callback}
      XDG_CONFIG_HOME: /tmp/medusa-config
      APPDATA: /tmp/medusa-config
      ADMIN_CORS: ${ADMIN_CORS:?ADMIN_CORS must be configured}
      AUTH_CORS: ${AUTH_CORS:?AUTH_CORS must be configured}
      LOCALAPPDATA: /tmp/medusa-config
      STORE_CORS: ${STORE_CORS:?STORE_CORS must be configured}
      STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:?STOREFRONT_ORIGIN must be configured}
    restart: unless-stopped
    volumes:
      - .:/app
      - medusa_node_modules:/app/node_modules
      - medusa_config:/tmp/medusa-config
    tmpfs:
      - /tmp
      - /run
    labels:
      com.universal-music-store.service: medusa
      com.universal-music-store.tier: dev
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
volumes:
  medusa_node_modules:
  medusa_config:
